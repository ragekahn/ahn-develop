[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-app"
version = "0.1.0"
description = "A minimal Python app that calls OpenAI or Anthropic chat APIs through a single client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["llm_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
